<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MDLDownloader Extension</title>
    <link rel="icon" type="image/png" href="icons/icon48.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 395px;
            padding: 14px;
            background: #121316;
            color: #e4e6eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #22252a;
        }
        .brand {
            font-family: 'Segoe UI Black', 'Arial Black', Impact, sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.7px;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            text-shadow: 0 2px 10px rgba(245, 184, 0, 0.25);
        }
        .mdl-badge {
            background: linear-gradient(135deg, #ffd000 0%, #f59e0b 100%);
            color: #0c0d0f;
            padding: 1px 7px;
            border-radius: 4px;
            margin-right: 4px;
            font-weight: 900;
            transform: skewX(-8deg);
            box-shadow: 0 0 10px rgba(245, 184, 0, 0.35);
            display: inline-block;
        }
        .dl-text {
            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.4px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .full-tab-btn {
            background: #181a20;
            color: #d1d5db;
            border: 1px solid #2e323c;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .full-tab-btn:hover {
            border-color: #f5b800;
            color: #f5b800;
        }

        /* Session / Login Banner */
        .card {
            background: #181a20;
            border: 1px solid #262930;
            border-radius: 4px;
            padding: 10px 11px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card-left {
            min-width: 0;
        }
        .label {
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 2px;
        }
        .val {
            font-weight: 600;
            color: #ffffff;
            font-size: 12px;
            word-break: break-word;
        }
        .val.logged {
            color: #4ade80;
        }
        .session-btn {
            background: #f5b800;
            color: #0c0d0f;
            border: none;
            padding: 7px 12px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .session-btn:hover:not(:disabled) {
            background: #ffca28;
        }
        .session-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .session-btn.secondary {
            background: #252830;
            color: #f5b800;
            border: 1px solid rgba(245, 184, 0, 0.35);
        }

        /* Manual Profile / URL Search Bar inside Extension */
        .search-card {
            background: #181a20;
            border: 1px solid #262930;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .search-label {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        .search-row {
            display: flex;
            gap: 6px;
        }
        .search-input {
            flex: 1;
            height: 32px;
            padding: 0 9px;
            background: #121316;
            border: 1px solid #32363f;
            border-radius: 3px;
            color: #ffffff;
            font-size: 12px;
            outline: none;
        }
        .search-input:focus {
            border-color: #f5b800;
        }
        .search-btn {
            background: #252830;
            color: #e4e6eb;
            border: 1px solid #383c47;
            border-radius: 3px;
            padding: 0 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .search-btn:hover:not(:disabled) {
            border-color: #f5b800;
            color: #f5b800;
        }

        .games-section {
            display: none;
            background: #181a20;
            border: 1px solid #262930;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .games-section.visible {
            display: block;
        }
        .games-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid #262930;
            font-weight: 600;
            color: #f5b800;
        }
        .games-list {
            max-height: 175px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 4px;
        }
        .game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121316;
            padding: 5px 8px;
            border-radius: 3px;
            border: 1px solid #22252a;
            cursor: pointer;
            user-select: none;
        }
        .game-row:hover {
            border-color: #383c47;
        }
        .game-left {
            display: flex;
            align-items: center;
            gap: 7px;
            overflow: hidden;
        }
        .game-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
            color: #e4e6eb;
        }
        .game-count {
            font-family: Consolas, monospace;
            font-size: 11px;
            color: #f5b800;
            background: rgba(245, 184, 0, 0.12);
            padding: 1px 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .opt-row {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid #262930;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #d1d5db;
            font-size: 11px;
        }
        .btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.15s;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .btn-gold {
            background: #f5b800;
            color: #0c0d0f;
        }
        .btn-gold:hover:not(:disabled) {
            background: #ffca28;
        }
        .status-box {
            font-size: 11px;
            color: #9ca3af;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand"><span class="mdl-badge">MDL</span><span class="dl-text">DOWNLOADER</span></div>
        <div class="header-right">
            <button id="openFullTabBtn" type="button" class="full-tab-btn" title="Open dedicated full-page downloader tab">↗ Full Tab</button>
        </div>
    </div>

    <!-- Account Status Banner: Shows "Logged in as @user" + "My Clips" button (manual trigger, no auto-fetch!) -->
    <div class="card">
        <div class="card-left">
            <div class="label">Medal.tv Account</div>
            <div id="sessionStatus" class="val">Checking session...</div>
        </div>
        <button id="actionSessionBtn" type="button" class="session-btn secondary">Log In on Medal.tv</button>
    </div>

    <!-- Manual Username or Profile URL Input -->
    <div class="search-card">
        <div class="search-label">Scan Any Username or Profile URL:</div>
        <form id="manualSearchForm" class="search-row">
            <input
                id="manualProfileInput"
                type="text"
                class="search-input"
                placeholder="https://medal.tv/u/username or username"
                required
            />
            <button id="manualScanBtn" type="submit" class="search-btn">Scan</button>
        </form>
    </div>

    <!-- Game Category Checkboxes Section -->
    <div id="gamesSection" class="games-section">
        <div class="games-header">
            <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                <input type="checkbox" id="toggleAllGames" checked />
                <span id="targetUserLabel">Select Games</span>
            </label>
            <span id="selectedClipsSummary" style="color:#e4e6eb; font-size:11px;">0 videos selected</span>
        </div>
        <div id="gamesList" class="games-list"></div>
        <label class="opt-row" style="cursor:pointer;">
            <input type="checkbox" id="subfoldersCheck" checked />
            <span>Organize into Game Subfolders inside MyClips.zip</span>
        </label>
    </div>

    <!-- Opens Full-Page Downloader Tab so clicking away never cancels the download! -->
    <button id="downloadZipBtn" class="btn btn-gold" disabled>
        Open Full Downloader &amp; Save MyClips.zip ↗
    </button>

    <div id="progressStatus" class="status-box">
        Click <strong>My Clips</strong> above to load your own library, or enter any public username to scan. Downloads run in a full tab so clicking away won't interrupt them.
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
